<!DOCTYPE html>
<html>
<style>

#mydiv1 {
  position: absolute;
  left: 5px;
  z-index: 9;
  background-color: #f1f1f1;
  text-align: center;
  border: 1px solid #d3d3d3;
}

#mydiv1header {
  padding: 10px;
  cursor: move;
  z-index: 10;
  background-color: #2196F3;
  color: #fff;
}

#mydiv2 {
  position: absolute;
  left: 50px;
  z-index: 9;
  background-color: #f1f1f1;
  text-align: center;
  border: 1px solid #d3d3d3;
}

#mydiv2header {
  padding: 10px;
  cursor: move;
  z-index: 10;
  background-color: #2196F3;
  color: #fff;
}


#myButtonSave {
  position: absolute;
  left: 50px;
  top: 200px;
  z-index: 9;
  background-color: #2196F3;
  text-align: center;
  border: 1px solid #d3d3d3;
  color: #fff;
}


</style>
<body>

<h1>Draggable DIV Element</h1>

<p>Click and hold the mouse button down while moving the DIV element</p>

<div id="mydiv1" >
  <div id="mydiv1header">Click here to move</div>
  <p>Move</p>
  <p>this</p>
  <p>DIV</p>
</div>

<div id="mydiv2" >
  <div id="mydiv2header">Click here to move</div>
  <p>Move</p>
  <p>this</p>
  <p>DIV</p>
</div>


<div id="myButtonSave" >
  <p>Save</p>
  <p>the</p>
  <p>positions</p>
</div>


<script>

//
//Make the DIV element draggagle:
//
dragElement(document.getElementById("mydiv1"));
dragElement(document.getElementById("mydiv2"));

//Added 5/12/2019 thomas
var button_div = document.getElementById("myButtonSave");
button_div.addEventListener('click', function (event) {
     var moveable_div1 = document.getElementById("mydiv1");
     alert("Div #1  Left coordinate: " + moveable_div1.offsetLeft + ", Top coordinate: " + moveable_div1.offsetTop);
     var moveable_div2 = document.getElementById("mydiv2");
     alert("Div #2  Left coordinate: " + moveable_div2.offsetLeft + ", Top coordinate: " + moveable_div2.offsetTop);
 });

function dragElement(elmnt) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (document.getElementById(elmnt.id + "header")) {
    /* if present, the header is where you move the DIV from:*/
    document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
  } else {
    /* otherwise, move the DIV from anywhere inside the DIV:*/
    elmnt.onmousedown = dragMouseDown;
  }

  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    // get the mouse cursor position at startup:
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    // call a function whenever the cursor moves:
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    // calculate the new cursor position:
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    // set the element's new position:
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";

    //Record the position.  
   if (document.getElementById(elmnt.id + "header")) {
        /* if present, the header is where you move the DIV from:*/
        //-----document.getElementById(elmnt.id + "header").innerHTML = "Hello, " + elmnt.id;
        document.getElementById(elmnt.id + "header").innerHTML = "Hello, elmnt.style.left = " + elmnt.style.left;
    } 

  }

  function closeDragElement() {
    /* stop moving when mouse button is released:*/
    document.onmouseup = null;
    document.onmousemove = null;
  }
}
</script>

</body>
</html>
